# EmailBot web - static SPA served by nginx (non-root image, port 8080).
# TLS is expected to be terminated by the platform / load balancer in front.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;

  # nginx does not inherit add_header into locations that define their own,
  # so every location includes the security headers.
  include /etc/nginx/snippets/security-headers.conf;

  # Hashed build assets: cache forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The entry point must always be revalidated (new deployments).
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # SPA fallback: client-side routes (/inbox, /reset-password, ...) load index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
